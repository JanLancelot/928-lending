name: Enterprise Quality Gate & Test Suite

on:
  push:
    branches: [ main, feat/*, security/*, infra/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Linter
        run: npm run lint

      - name: Run Vitest Unit & Component Tests with Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          HMAC_SECRET_KEY: test-hmac-secret-key-32-chars-long

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/
